      <h1>Lighthouse Quay</h1>
      <p>
        Lighthouse Quay is a small working harbour on the north shore. The stone quay was finished
        in 1987, after the old timber pier was lost in a storm.
      </p>
      <p>Today it is home to six fishing boats and a weekly market.</p>
