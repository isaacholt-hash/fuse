name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash scripts/secret-scan.sh
      # M8 step 14: the click-through tests' scripted models must never reach a release build.
      - name: Release bundle has no test code
        run: |
          pnpm build
          if grep -rq fuse-e2e-scripted-build dist; then echo "The test build's code is in the release bundle"; exit 1; fi

  rust:
    name: Rust fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The runners' Ubuntu mirror is sometimes very slow, hence the long limit and retries.
      # (Caching the packages with cache-apt-pkgs-action broke linking: it drops the .so symlinks.)
      - name: Tauri system dependencies
        timeout-minutes: 25
        run: |
          # The runners' Azure mirror stalled the Rust job five times on 2026-10-27; use Ubuntu's own.
          # Newer runner images list the mirror in apt-mirrors.txt, so that file is switched too.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev bubblewrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs the frontend dist folder to exist at compile time.
      - run: mkdir -p dist
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo fmt --manifest-path src-tauri/sandbox-win/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # M8 step 9: the Windows sandbox, tested where it runs (HULK can't), and the app checked on
  # Windows so its Windows-only code is linted before it merges, not first built at release.
  windows:
    name: Windows sandbox, clippy
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/sandbox-win
      - run: cargo clippy --manifest-path src-tauri/sandbox-win/Cargo.toml --all-targets -- -D warnings
      # One at a time: the tests share the one container and change folder permissions.
      - run: cargo test --manifest-path src-tauri/sandbox-win/Cargo.toml -- --test-threads=1
      # tauri::generate_context! needs the frontend dist folder to exist at compile time.
      # These run even when a sandbox test fails, so one run reports both.
      - if: ${{ !cancelled() }}
        run: mkdir dist
      - if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # M8 step 14: the app driven like a person would use it, on Windows, with scripted models
  # (src/e2e/deps.ts) and no keys. e2e/README.md says how it works.
  e2e:
    name: Windows click-through
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e
          cache-bin: true
      - name: tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Edge WebDriver for this WebView2
        shell: pwsh
        run: |
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          Write-Host "WebView2 $v"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          try { Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile $zip }
          catch { Invoke-WebRequest "https://msedgedriver.azureedge.net/$v/edgedriver_win64.zip" -OutFile $zip }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver"
      - name: Test build
        env:
          VITE_E2E_FOLDER: C:\fuse-e2e
        run: pnpm tauri build --debug --no-bundle --config src-tauri/tauri.e2e.conf.json
      - name: Click-through tests
        env:
          FUSE_E2E_APP: ${{ github.workspace }}\src-tauri\target\debug\fuse.exe
          FUSE_E2E_NATIVE_DRIVER: ${{ runner.temp }}\edgedriver\msedgedriver.exe
          FUSE_E2E_FOLDER: C:\fuse-e2e
        run: pnpm e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
