name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash scripts/secret-scan.sh

  rust:
    name: Rust fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The runners' Ubuntu mirror is sometimes very slow, hence the long limit and retries.
      # (Caching the packages with cache-apt-pkgs-action broke linking: it drops the .so symlinks.)
      - name: Tauri system dependencies
        timeout-minutes: 25
        run: |
          # The runners' Azure mirror stalled the Rust job five times on 2026-10-27; use Ubuntu's own.
          # Newer runner images list the mirror in apt-mirrors.txt, so that file is switched too.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev bubblewrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs the frontend dist folder to exist at compile time.
      - run: mkdir -p dist
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo fmt --manifest-path src-tauri/sandbox-win/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # M8 step 9: the Windows sandbox, tested where it runs (HULK can't), and the app checked on
  # Windows so its Windows-only code is linted before it merges, not first built at release.
  windows:
    name: Windows sandbox, clippy
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/sandbox-win
      - run: cargo clippy --manifest-path src-tauri/sandbox-win/Cargo.toml --all-targets -- -D warnings
      # One at a time: the tests share the one container and change folder permissions.
      - run: cargo test --manifest-path src-tauri/sandbox-win/Cargo.toml -- --test-threads=1
      # tauri::generate_context! needs the frontend dist folder to exist at compile time.
      - run: mkdir dist
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
