name: PC tests

# M8 step 15: tests on Isaac's Windows PC, through a self-hosted runner (docs/windows-test-runner.md).
# Only after a release from main, or started by hand. Never on pull requests: the repo is public,
# so a stranger's code must never run on that PC.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      update_test:
        description: "Also run the update test (installs the previous release, then updates it)"
        type: boolean
        default: true

concurrency:
  group: pc-tests
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

# Windows PowerShell 5.1: every PC has it; PowerShell 7 isn't on Isaac's.
defaults:
  run:
    shell: powershell

jobs:
  pc:
    name: Tests on Isaac's PC
    # A release that ran because of a push to main, or a run started by hand. Nothing else.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, Windows, fuse-windows]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the release was built from.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # The test build from CI's run on the same commit, so this PC needs no Rust.
      - name: Find CI's test build
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: ./scripts/pc/ci-run.ps1
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
          path: e2e-app
      - name: Click-through tests on this desktop
        id: e2e
        continue-on-error: true
        env:
          FUSE_E2E_APP: ${{ github.workspace }}\e2e-app\fuse.exe
          FUSE_E2E_FOLDER: C:\fuse-e2e
          # M9 step 6: install Python and run a script in the Windows sandbox (this PC only).
          FUSE_E2E_PYTHON: "1"
        run: pnpm e2e
      - name: Update test
        id: update
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_test }}
        continue-on-error: true
        run: ./scripts/pc/update-test.ps1
      - name: Local model benchmark
        id: local
        continue-on-error: true
        env:
          FUSE_BIN: ${{ github.workspace }}\e2e-app\fuse.exe
        run: |
          if (Test-Path "$env:APPDATA\com.isaacholt.fuse\models\*.gguf") { pnpm local:bench }
          else {
            Write-Host "Local model benchmark skipped: no local model installed."
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Local model benchmark skipped: no local model installed.`n")
          }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pc-e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
      - name: Summary, and an issue if anything failed
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          E2E: ${{ steps.e2e.outcome }}
          UPDATE: ${{ steps.update.outcome }}
          LOCAL: ${{ steps.local.outcome }}
        run: ./scripts/pc/summary.ps1
