[package]
name = "fuse"
version = "0.1.0"
description = "FUSE — frontier models, unified, spend-efficient"
authors = ["Isaac Holt"]
edition = "2024"
# fuse-server is a second binary (M10); `cargo run` and Tauri mean the app.
default-run = "fuse"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "fuse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fuse-server"
path = "src/bin/fuse-server.rs"
required-features = ["server"]

[features]
# fuse-server (M10, Linux only): the web app and runner host on HULK.
server = ["dep:axum", "dep:tower-http", "tokio/net", "tokio/rt-multi-thread", "tokio/signal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite encrypted with SQLCipher (M1 C2). sqlx is the driver the SQL plugin used underneath;
# the bundled-sqlcipher feature makes every SQLite in the build SQLCipher, with OpenSSL vendored
# so Windows needs no system crypto library.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.3"
keyring = "4.2"
reqwest = "0.13"
tauri-plugin-opener = "2.7.2"
# Native "Save as" for artifact exports (AR-04); pinned: released 2026-10-10.
tauri-plugin-dialog = "=2.8.2"
# Global quick-capture shortcut (CH-08, PL-07); pinned: released 2026-10-10.
tauri-plugin-global-shortcut = "=2.4.1"
sha2 = "0.11.1"
# .gitignore rules for the coding agent's repository access (CA-01); pinned: released 2026-08-04.
ignore = "=0.4.33"
# Coding agent commands (CA-03): child processes with streamed output and time limits. Already
# in the build through Tauri's runtime.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
tauri-plugin-process = "2"
# Desktop only, like the app (CLAUDE.md: P1 is desktop only).
tauri-plugin-updater = "2"

# The local model (M7, LL-02): llama.cpp, CPU only, in a worker process (src/local_worker.rs).
# Pinned: released 2026-10-15. Default features off (no Android bits); OpenMP for CPU threads.
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["openmp"] }

# Hardware detection for the local model (M7 step 5, LL-03): memory and free disk, no privileges.
# Pinned: 0.39.6 released 2026-07-09 (0.40.0 is days old).
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk"] }

# Ending a command's whole process group on the time limit or Stop (CA-03, src/exec.rs).
# fuse-server (M10). Pinned: axum 0.8.9 released 2026-04-14; tower-http 0.6.11 (2026-05-18) is
# already in the build through Tauri.
axum = { version = "=0.8.9", optional = true, features = ["ws"] }
tower-http = { version = "=0.6.11", optional = true, features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows Hello for the app lock (SE-03, src/hello.rs): the windows crates Tauri already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }
windows-future = "=0.3.2"
# The command sandbox (WF-07, M8 step 9): its own crate so Windows CI tests it quickly.
fuse-sandbox-win = { path = "sandbox-win" }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
